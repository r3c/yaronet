name: Verify

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  schedule:
    - cron: "20 4 * * *"

jobs:
  test:
    name: Run E2E tests (PHP ${{ matrix.version.php }}, MySQL ${{ matrix.version.mysql }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        version:
          - mysql: "8.0"
            php: "8.1"
          - mysql: "8.0"
            php: "8.3"
          - mysql: "8.0"
            php: "8.5"

    services:
      mysql:
        image: mysql:${{ matrix.version.mysql }}
        ports:
          - "3306:3306"
        env:
          MYSQL_DATABASE: yaronet
          MYSQL_ROOT_PASSWORD: yaronet
        options: --health-cmd "mysqladmin ping" --health-interval 1s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Set up PHP ${{ matrix.version.php }}
        uses: shivammathur/setup-php@v2
        with:
          extensions: curl, gd, mbstring, mcrypt, mysql, xml
          ini-values: pcre.jit=0, zend.assertions=1 # Disable PRCE JIT (failing on GitHub runners), enable asserts
          php-version: ${{ matrix.version.php }}
        env:
          phpts: ts
      - name: Enable Apache modules
        run: sudo a2enmod php${{ matrix.version.php }} rewrite
      - name: Setup Apache server
        run: |
          while read source destination; do
            sudo install -d "$(dirname "$destination")"
            sed -e "s?%CI_DIRECTORY%?$(pwd)?g" "setup/ci/$source" |
              sudo tee "$destination" > /dev/null
          done << EOF
          apache2-service-override.conf /etc/systemd/system/apache2.service.d/override.conf
          apache2-site.conf /etc/apache2/sites-available/000-default.conf
          EOF
          sudo systemctl daemon-reload
          sudo systemctl restart apache2
      - name: Setup MySQL database
        run: sudo mysql --host=127.0.0.1 --user=root --password=yaronet yaronet < setup/database/schema.sql
      - name: Allow traversing home directory
        run: chmod +x "$HOME"
      - name: Setup environment
        run: sh setup/configure.sh
      - name: Transfer ownership
        run: sudo chown -R www-data:www-data src
      - name: Initialize yAronet
        run: |
          curl -f -s -d 'meta_admin_login=test&meta_admin_password=test&engine_network_http_insecure=1&engine_network_sql_connection=mysqli%3A%2F%2Froot%3Ayaronet%40127.0.0.1%2Fyaronet%3Fcharset%3Dutf8mb4&engine_network_route_page=%2Fsrc&engine_system_encoding_charset=utf-8&version=1' -o /dev/null http://127.0.0.1/src/install.php
          test -f src/.htaccess -a -f src/config.php -a -f src/static/.htaccess
      - name: Run test suite
        run: |
          curl -s http://127.0.0.1/test/ |
            tee /tmp/run.log |
            grep -Fq 'test suite stop.' ||
            ( cat /tmp/run.log && false )

  validate:
    name: Validate
    runs-on: ubuntu-latest

    needs:
      - test

    steps:
      - run: true
